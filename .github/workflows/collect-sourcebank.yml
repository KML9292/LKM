name: Samguk SourceBank — collect and verify
on:
  push:
    paths:
      - '.github/workflows/collect-sourcebank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Collect pinned upstream archives, inspect and package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request,zipfile,shutil,time
          E=[["ink-unity","inkle/ink-unity-integration","aa7b8b4f78e2046f203e47f89a10a6f9f9ba67c6","LICENCE.md","81452924100f31ec1f85d99f6bada8abe06ff4f0",1183,3984710],["unitask","Cysharp/UniTask","a77a1b4a89824fb6df293099de3060daf2a432c1","LICENSE","e44b59b10deacda8e7d1a81555429cdb3f7d12c8",512,3321328],["unityhfsm","Inspiaaa/UnityHFSM","f8fdc2efb862522acd26fab6cd940886c84cde37","LICENSE.md","02e82860b250f0ce0cf2e12d1afda9e0aea0d6e5",192,2290188],["goap","crashkonijn/GOAP","b9409d7537cf0bba3f6075fe4cc6472f135c522a","LICENSE","8dada3edaf50dbc082c9a125058f25def75e625a",1767,22022006],["gameci-test-runner","game-ci/unity-test-runner","3651041789079526956e876434786ab98af4c8e8","LICENSE","28350226510cf41ae3e3a349fc3eb0b863f29a99",161,10007333],["vcontainer","hadashiA/VContainer","fb24d752968c5cabe0cfb4fcf8861c74772c5b14","LICENSE","097673bfe6511cf4b72ce26d937441c0ffe733f5",3240,27719779],["odin-serializer","TeamSirenix/odin-serializer","ba19025b3dc38de8cebb10f94a583d1ff303ad59","LICENSE","2bb9ad240fa04c8cf706a4901c4807878e90c2dc",367,37820772],["fluid-behavior-tree","ashblue/fluid-behavior-tree","278131723445425fec62e4fb5b0462e2f4a1f754","LICENSE.md","862d32874cdb579b0255ff4f6e4101e0dd96603f",309,918607],["tactical-turnbased-template","Battledrake/TacticalTurnBasedTemplate","7caf4471f57344122af1656a53c05ed35be8ede4","LICENSE.md","99f7fb9762f576814b6aa991837e9317461343d1",1250,47942844],["emblem-forge","DallenLarson/EmblemForge","b4c76ed72eba48d241833b33917aaffe81bd2923","LICENSE","20bd3b0a5fbd424ef1cb6bf6da1cca071feab818",14882,259286756]]
          p=pathlib.Path("Samguk_SourceBank"); (p/"archives").mkdir(parents=True,exist_ok=True); (p/"sources").mkdir(exist_ok=True); (p/"metadata").mkdir(exist_ok=True)
          report=[]
          for name,repo,sha,lic,licblob,expected,bytes_expected in E:
           print("Collecting",repo,sha,flush=True)
           a=p/"archives"/(name+"-"+sha+".zip")
           for retry in range(3):
            try:
             req=urllib.request.Request("https://codeload.github.com/"+repo+"/zip/"+sha,headers={"User-Agent":"SamgukSourceBank/1.3"})
             with urllib.request.urlopen(req,timeout=240) as f,a.open("wb") as dst: shutil.copyfileobj(f,dst)
             break
            except Exception:
             a.unlink(missing_ok=True)
             if retry==2: raise
             time.sleep(5*(retry+1))
           with zipfile.ZipFile(a) as z:
            files=[x for x in z.infolist() if not x.is_dir()]
            assert len(files)==expected,(repo,"file_count",len(files),expected)
            assert sum(x.file_size for x in files)==bytes_expected,(repo,"size")
            assert z.testzip() is None,(repo,"CRC")
            roots={x.filename.split("/")[0] for x in files}
            assert len(roots)==1,(repo,"roots",roots)
            root=roots.pop()
            assert root.lower().startswith(repo.split("/")[-1].lower()+"-")
            assert sha.lower().startswith(root.split("-")[-1].lower()),(repo,"commit-root",root)
            names={x.filename for x in files}
            body=z.read(root+"/"+lic)
            blob=hashlib.sha1(b"blob "+str(len(body)).encode()+b"\\0"+body).hexdigest()
            assert blob==licblob,(repo,"license-blob")
            for x in files:
             parts=pathlib.PurePosixPath(x.filename).parts
             assert ".." not in parts and "\\" not in x.filename and not x.filename.startswith("/")
             out=p/"sources"/name/pathlib.Path(*parts[1:])
             out.parent.mkdir(parents=True,exist_ok=True)
             with z.open(x) as src,out.open("wb") as dst: shutil.copyfileobj(src,dst)
           report.append(dict(name=name,repo=repo,commit=sha,license_file=lic,license_blob=blob,original_archive_sha256=hashlib.sha256(a.read_bytes()).hexdigest(),file_count=expected,uncompressed_bytes=bytes_expected,unity63_tested=False,assets_cleared=False))
          (p/"metadata"/"SOURCE_MANIFEST.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          (p/"metadata"/"IMPORTANT.txt").write_text("Original code archives plus expanded files. Do not ship demo media before rights review. Unity compatibility not tested.\\n")
          with zipfile.ZipFile("Samguk_Full_Original_SourceBank.zip","w",compression=zipfile.ZIP_DEFLATED,compresslevel=2,allowZip64=True) as z:
           for f in p.rglob("*"):
            if f.is_file(): z.write(f,arcname=f.as_posix())
          with zipfile.ZipFile("Samguk_Full_Original_SourceBank.zip") as z: assert z.testzip() is None
          print("ARCHIVE_OK",pathlib.Path("Samguk_Full_Original_SourceBank.zip").stat().st_size,flush=True)
          PY
      - name: Upload full source archive
        uses: actions/upload-artifact@v4
        with:
          name: Samguk-Full-SourceBank
          path: Samguk_Full_Original_SourceBank.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
